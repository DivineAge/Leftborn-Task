version: '1'

services:
  Test.api:
    image: ${DOCKER_REGISTRY-}Lefbornapi
    container_name: Lefborn.Api
    build:
      context: .
      dockerfile: src/API/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081

  Test.database:
    image: postgres:latest
    container_name: Lefborn.Database
    environment:
      - POSTGRES_DB=Test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5432:5432



      
